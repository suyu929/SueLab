        // --- Premium Spotlight Card Component ---
        function SpotlightCard({ children, className = "" }) {
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const [isHovered, setIsHovered] = useState(false);
            const containerRef = useRef(null);

            const handleMouseMove = (e) => {
                if (containerRef.current) {
                    const rect = containerRef.current.getBoundingClientRect();
                    setMousePos({
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top,
                    });
                }
            };

            return (
                <div
                    ref={containerRef}
                    onMouseMove={handleMouseMove}
                    onMouseEnter={() => setIsHovered(true)}
                    onMouseLeave={() => setIsHovered(false)}
                    className={`relative overflow-hidden rounded-2xl shadow-none dark:shadow-2xl transition-all duration-300 group ${className}`}
                >
                    {/* Dynamic Spotlight Glow */}
                    <div 
                        className={`absolute inset-0 z-10 pointer-events-none transition-opacity duration-500 ${isHovered ? 'opacity-100' : 'opacity-0'}`}
                        style={{
                            background: `radial-gradient(350px circle at ${mousePos.x}px ${mousePos.y}px, var(--hover-color-1) 0%, var(--hover-color-2) 35%, var(--hover-color-3) 70%, transparent 100%)`,

                        }}

                    <div className="relative z-10 h-full">
                        {children}
                    </div>
                </div>
            );
        }

                if (!isChatOpen) {
                    resetTimers();
                    return;
                }

                const startInactivityTimer = () => {
                    resetTimers();
                    inactivityTimerRef.current = setTimeout(() => {
                        setCountdown(10);
                    }, 30000);
                };

                startInactivityTimer();
                return () => resetTimers();

                if (countdown > 0) {
